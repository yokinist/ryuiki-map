name: E2E

# ブラウザで動かすテスト。国土地理院の標高タイルに依存する（落ちているとテストも落ちる）ので、
# すべての PR では走らせず、計算・データ・画面に関わるファイルが変わった PR と、週1回・手動に絞る
on:
  pull_request:
    paths:
      - "src/client/**"
      - "public/rivers/**"
      - "public/karte/**"
      - "index.html"
      - "e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 21 * * 0" # 月曜 6:00 JST
  workflow_dispatch:
    inputs:
      base_url:
        description: "対象の URL（空なら手元でビルドしたものに対して走る）。本番や PR のプレビューを指定できる"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          BASE_URL: ${{ inputs.base_url }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
